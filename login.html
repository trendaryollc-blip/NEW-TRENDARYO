<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your Trendaryo account to view orders, track shipments, manage wishlist, and update profile.">
    <meta name="keywords" content="login, sign in, account access">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="Trendaryo">
    <link rel="canonical" href="https://trendaryo.com/login.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trendaryo.com/login.html">
    <meta property="og:title" content="Login - Trendaryo Account">
    <meta property="og:description" content="Login to your Trendaryo account to view orders, track shipments, manage wishlist, and update profile.">
    <meta property="og:image" content="https://trendaryo.com/assets/trendaryo-crown-star-logo.svg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://trendaryo.com/login.html">
    <meta property="twitter:title" content="Login - Trendaryo Account">
    <meta property="twitter:description" content="Login to your Trendaryo account to view orders, track shipments, manage wishlist, and update profile.">
    <meta property="twitter:image" content="https://trendaryo.com/assets/trendaryo-crown-star-logo.svg">
    <title>Login - Trendaryo Account</title>
    <link rel="stylesheet" href="responsive-universal.css">
    <script src="performance.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root{--accent:#00f0ff;--accent-2:#ff00aa;--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Rajdhani',sans-serif;background:linear-gradient(180deg,#0a0a2a,#1a1a40);color:#fff;min-height:100vh;padding-top:140px;padding-bottom:2rem;}
        .login-wrapper{display:flex;align-items:center;justify-content:center;padding:2rem;min-height:calc(100vh - 140px);}
        .login-container{max-width:450px;width:100%;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:3rem;backdrop-filter:blur(10px);}
        .logo{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent-2));background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:2rem;}
        h1{font-family:'Orbitron',sans-serif;text-align:center;margin-bottom:2rem;font-size:1.8rem;}
        .form-group{margin-bottom:1.5rem;}
        .form-group label{display:block;margin-bottom:0.5rem;color:#ccc;}
        .form-group input{width:100%;padding:0.8rem;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border);color:#fff;font-family:inherit;font-size:1rem;}
        .form-group input:focus{outline:none;border-color:var(--accent);}
        .btn{width:100%;padding:1rem;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:inherit;font-size:1rem;background:var(--accent);color:#000;}
        .btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,240,255,0.3);}
        .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .divider{text-align:center;margin:1.5rem 0;color:#888;position:relative;}
        .divider:before,.divider:after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--glass-border);}
        .divider:before{left:0;}
        .divider:after{right:0;}
        .links{text-align:center;margin-top:1.5rem;}
        .links a{color:var(--accent);text-decoration:none;}
        .links a:hover{text-decoration:underline;}
        .error{background:rgba(255,0,0,0.2);border:1px solid #ff0000;color:#ff6666;padding:0.8rem;border-radius:8px;margin-bottom:1rem;display:none;}
        .error.show{display:block;}
        @media(max-width:600px){
            body{padding-top:100px;}
            .login-wrapper{padding:1rem;min-height:calc(100vh - 100px);}
            .login-container{padding:1.5rem;border-radius:14px;}
            .logo{font-size:1.5rem;margin-bottom:1.5rem;}
            h1{font-size:1.4rem;margin-bottom:1.5rem;}
            .form-group{margin-bottom:1.2rem;}
            .form-group input{padding:0.7rem;font-size:0.95rem;}
            .btn{padding:0.85rem;font-size:0.95rem;}
        }
        @media(max-width:480px){
            .login-container{padding:1.25rem;}
            .divider:before,.divider:after{width:35%;}
        }
    </style>
<script src="bg.js"></script>
</head>
<body>
    <script src="components.js"></script>
    <canvas id="three-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
    <div class="login-wrapper">
    <div class="login-container">
        <div class="logo">TRENDARYO</div>
        <h1>Welcome Back</h1>
        <div style="background:rgba(0,240,255,0.06);border:1px solid rgba(0,240,255,0.25);border-radius:14px;padding:1rem 1.25rem;margin:0 0 1.5rem;text-align:left;">
            <div style="font-family:Orbitron,sans-serif;font-size:0.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent,#00f0ff);margin-bottom:0.5rem;">Members also get</div>
            <div style="color:rgba(255,255,255,0.75);font-size:0.9rem;line-height:1.9;">
                ? 1 point per $1 � redeem as store credit<br>
                ? Order tracking & instant reorder<br>
                ? Early access to drops & member deals
            </div>
        </div>
        
        <div class="error" id="error-message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" id="login-btn">Login</button>
        </form>
        
        <div class="divider">OR</div>
        
        <div class="links">
            <p>Don't have an account? <a href="register.html">Sign up</a></p>
            <p style="margin-top:0.5rem;"><a href="forgot-password.html">Forgot Password?</a></p>
            <p style="margin-top:0.5rem;"><a href="index.html">? Back to Home</a></p>
        </div>
    </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-auth-helper.js"></script>
    
    <script>
        var auth, db;
        
        window.addEventListener('load', async function() {
            try {
                if (typeof initFirebase === 'function') {
                    var firebase = await initFirebase();
                    auth = firebase.auth;
                    db = firebase.db;
                    
                    if (!auth || !db) {
                        var errorDiv = document.getElementById('error-message');
                        errorDiv.textContent = 'Firebase not initialized. Please check your internet connection and refresh.';
                        errorDiv.classList.add('show');
                    }
                }
            } catch (err) {
                console.error('Firebase init error:', err);
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var btn = document.getElementById('login-btn');
            var errorDiv = document.getElementById('error-message');
            
            if (!email || !password) {
                errorDiv.textContent = 'Please enter both email and password';
                errorDiv.classList.add('show');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            errorDiv.classList.remove('show');
            
            try {
                var result = await FirebaseAuth.login(email, password);
                
                if (result.success) {
                    if (window.updateAccountMenu) {
                        window.updateAccountMenu();
                    }
                    
                    var redirectUrl = result.user.role === 'admin' ? 'admin.html' : 'shop.html';
                    window.location.href = redirectUrl;
                }
            } catch (err) {
                console.error('Login error:', err);
                
                var errorMessage = 'Login failed';
                
                if (err.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email';
                } else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    errorMessage = 'Incorrect password';
                } else if (err.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address';
                } else if (err.code === 'auth/user-disabled') {
                    errorMessage = 'This account has been disabled';
                } else if (err.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                } else if (err.message) {
                    errorMessage = err.message;
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
    <!-- Self-Healing System -->
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  console.log('Error caught:', msg);
  const errorDiv = document.createElement('div');
  errorDiv.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#f3f4f6; padding:10px; border-radius:5px; z-index:9999; border:1px solid #ccc;';
  errorDiv.innerHTML = '?? Something went wrong. Retrying...';
  document.body.appendChild(errorDiv);
  setTimeout(() => errorDiv.remove(), 3000);
  return false;
};
</script>
</body>
</html>
