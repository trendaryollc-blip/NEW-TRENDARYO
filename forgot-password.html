<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Trendaryo</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://trendaryo.com/forgot-password.html">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-crown-star.svg">
    <link rel="stylesheet" href="responsive-universal.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <script src="performance.js"></script>
    <script src="bg.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0a0a; --bg-deep: #0a0a2a;
            --accent: #00f0ff; --accent-2: #ff00aa; --accent-3: #00ff88;
            --text: #ffffff; --muted: rgba(255,255,255,0.66); --muted-2: rgba(255,255,255,0.45);
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1); --glass-border-2: rgba(255,255,255,0.18);
            --card-grad: linear-gradient(168deg, rgba(255,255,255,0.075), rgba(255,255,255,0.02));
            --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --font-d: 'Orbitron', sans-serif; --font-b: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-b); background: var(--bg-deep); color: #fff; overflow-x: hidden; }
        #three-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .page-offset { padding-top: 190px; padding-bottom: 3rem; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
        .fp-shell { max-width: 440px; margin: 0 auto; padding: 0 2.5rem; }
        .fp-card { background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .fp-header { text-align: center; margin-bottom: 2rem; }
        .fp-title { font-family: var(--font-d); font-size: 1.5rem; font-weight: 900; margin-bottom: 0.4rem; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .fp-sub { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
        .fp-field { margin-bottom: 1.25rem; }
        .fp-label { display: block; margin-bottom: 0.4rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted-2); }
        .fp-input { width: 100%; padding: 0.85rem 1rem; border-radius: var(--r-md); border: 1px solid var(--glass-border-2); background: rgba(255,255,255,0.05); color: #fff; font-family: var(--font-b); font-size: 0.95rem; outline: none; transition: border-color 0.25s, box-shadow 0.25s; }
        .fp-input:focus { border-color: rgba(0,240,255,0.6); box-shadow: 0 0 18px rgba(0,240,255,0.12); }
        .fp-input::placeholder { color: var(--muted-2); }
        .fp-btn { width: 100%; padding: 0.9rem; border-radius: var(--r-md); font-family: var(--font-d); font-size: 0.68rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
        .fp-btn:hover { box-shadow: 0 0 20px rgba(0,240,255,0.4); transform: translateY(-1px); }
        .fp-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .fp-msg { padding: 0.7rem 1rem; border-radius: var(--r-md); margin-bottom: 1.25rem; text-align: center; display: none; font-size: 0.92rem; }
        .fp-msg.success { display: block; background: rgba(0,255,136,0.08); border: 1px solid var(--accent-3); color: var(--accent-3); }
        .fp-msg.error { display: block; background: rgba(255,0,170,0.08); border: 1px solid var(--accent-2); color: var(--accent-2); }
        .fp-back { text-align: center; margin-top: 1.5rem; }
        .fp-back a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .fp-back a:hover { color: var(--accent-2); }
        @media(max-width:600px){
            body{padding-top:100px;}
            .fp-shell{padding:1rem;}
            .fp-card{padding:1.5rem;border-radius:14px;}
        }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <div id="header-container"></div>
    <script src="components.js"></script>

    <main class="page-offset">
        <div class="fp-shell">
            <div class="fp-card">
                <div class="fp-header">
                    <h1 class="fp-title">Forgot Password?</h1>
                    <p class="fp-sub">Enter your email and we'll send you a reset link.</p>
                </div>
                <div class="fp-msg" id="successMessage">Password reset link sent! Please check your email.</div>
                <div class="fp-msg" id="errorMessage">Email not found. Please try again.</div>
                <form id="forgotPasswordForm">
                    <div class="fp-field"><label class="fp-label">Email Address</label><input type="email" id="email" class="fp-input" placeholder="you@example.com" required></div>
                    <button type="submit" class="fp-btn" id="resetButton"><span id="buttonText">Send Reset Link</span></button>
                </form>
                <div class="fp-back"><p>Remember your password? <a href="login.html">Back to Login</a></p></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="firebase-config.js"></script>
    <script src="firebase-auth-helper.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var btn = document.getElementById('resetButton');
            var txt = document.getElementById('buttonText');
            var s = document.getElementById('successMessage');
            var err = document.getElementById('errorMessage');
            s.style.display = 'none'; err.style.display = 'none';

            if (!email) { err.textContent = 'Please enter your email address.'; err.style.display = 'block'; return; }

            btn.disabled = true; txt.textContent = 'Sending...';
            try {
                await FirebaseAuth.resetPassword(email);
                s.style.display = 'block';
                document.getElementById('forgotPasswordForm').reset();
            } catch (e) {
                err.textContent = e.message || 'Email not found. Please try again.';
                err.style.display = 'block';
            } finally {
                btn.disabled = false; txt.textContent = 'Send Reset Link';
            }
        });
    </script>
    <script>
        function hidePreloader() { var p = document.getElementById('preloader'); if (p) p.classList.add('hidden'); }
        if (document.readyState === 'complete') { setTimeout(hidePreloader, 600); } else { window.addEventListener('load', function () { setTimeout(hidePreloader, 600); }); }
        setTimeout(hidePreloader, 1500);
    </script>
</body>
</html>
