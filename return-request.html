<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return / Exchange Request - Trendaryo</title>
    <meta name="description" content="Request a return or exchange for your Trendaryo order.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://trendaryo.com/return-request.html">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-crown-star.svg">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <script src="performance.js"></script>
    <script src="bg.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0a0a; --bg-deep: #0a0a2a;
            --accent: #00f0ff; --accent-2: #ff00aa; --accent-3: #00ff88;
            --text: #ffffff; --muted: rgba(255,255,255,0.66); --muted-2: rgba(255,255,255,0.45);
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1); --glass-border-2: rgba(255,255,255,0.18);
            --card-grad: linear-gradient(168deg, rgba(255,255,255,0.075), rgba(255,255,255,0.02));
            --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --font-d: 'Orbitron', sans-serif; --font-b: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-b); background: var(--bg-deep); color: #fff; overflow-x: hidden; }
        #three-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .page-offset { padding-top: 190px; padding-bottom: 3rem; }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
        .rr-shell { max-width: 800px; margin: 0 auto; padding: 0 2.5rem; }

        .rr-hero { text-align: center; padding: 2rem; background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); margin-bottom: 2.5rem; }
        .rr-title { font-family: var(--font-d); font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; background: linear-gradient(135deg, #fff, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
        .rr-sub { color: var(--muted); font-size: 0.95rem; }

        .rr-card { background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); padding: 2rem; }
        .rr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        .rr-field { display: flex; flex-direction: column; gap: 0.4rem; }
        .rr-field.full { grid-column: 1 / -1; }
        .rr-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted-2); }
        .rr-input, .rr-select, .rr-textarea { padding: 0.75rem 0.9rem; border-radius: var(--r-md); border: 1px solid var(--glass-border-2); background: rgba(255,255,255,0.05); color: #fff; font-family: var(--font-b); font-size: 0.95rem; outline: none; transition: border-color 0.25s, box-shadow 0.25s; width: 100%; }
        .rr-input:focus, .rr-select:focus, .rr-textarea:focus { border-color: rgba(0,240,255,0.6); box-shadow: 0 0 18px rgba(0,240,255,0.12); }
        .rr-input::placeholder, .rr-textarea::placeholder { color: var(--muted-2); }
        .rr-select option { background: #0a0a2a; color: #fff; }
        .rr-textarea { min-height: 100px; resize: vertical; }

        .rr-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem; }
        .rr-btn { padding: 0.85rem 1.4rem; border-radius: var(--r-md); font-family: var(--font-d); font-size: 0.68rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; border: 0; }
        .rr-btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: #00202a; }
        .rr-btn-primary:hover { box-shadow: 0 0 20px rgba(0,240,255,0.4); transform: translateY(-1px); }
        .rr-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .rr-btn-secondary { background: transparent; border: 1px solid var(--glass-border-2); color: rgba(255,255,255,0.8); }
        .rr-btn-secondary:hover { border-color: rgba(255,255,255,0.5); color: #fff; }

        .rr-notice { margin-top: 1.25rem; padding: 0.8rem 1rem; border-radius: var(--r-md); display: none; font-size: 0.92rem; }
        .rr-notice.success { display: block; background: rgba(0,255,136,0.08); border: 1px solid var(--accent-3); color: var(--accent-3); }
        .rr-notice.error { display: block; background: rgba(255,0,170,0.08); border: 1px solid var(--accent-2); color: var(--accent-2); }

        .rr-preview { margin-top: 1.5rem; padding: 1.25rem; border-radius: var(--r-md); border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); display: none; }
        .rr-preview h3 { font-family: var(--font-d); font-size: 0.85rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--accent); }
        .rr-preview-pills { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .rr-pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.6rem; border-radius: var(--r-pill); border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); font-size: 0.82rem; color: var(--muted); }
        .rr-order-items { display: grid; gap: 0.6rem; }
        .rr-order-item { display: flex; gap: 0.75rem; align-items: center; padding: 0.7rem; border-radius: var(--r-md); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
        .rr-order-item img { width: 48px; height: 48px; object-fit: cover; border-radius: var(--r-sm); }
        .rr-order-item strong { display: block; font-size: 0.92rem; }
        .rr-order-item .muted { color: var(--muted); font-size: 0.85rem; }

        @media (max-width: 768px) { .rr-shell { padding: 0 1.5rem; } .rr-grid { grid-template-columns: 1fr; } }
        @media (max-width: 600px) { .rr-shell { padding: 0 1rem; } }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <div id="header-container"></div>
    <script src="components.js"></script>

    <main class="page-offset">
        <div class="rr-shell">
            <div class="rr-hero">
                <h1 class="rr-title">Return / Exchange</h1>
                <p class="rr-sub">Submit a return or exchange request using your order number.</p>
            </div>

            <div class="rr-card">
                <div class="rr-grid">
                    <div class="rr-field"><label class="rr-label">Order Number</label><input id="orderNumber" class="rr-input" placeholder="e.g., TRD-2024-000123"></div>
                    <div class="rr-field"><label class="rr-label">Email used on the order</label><input id="email" type="email" class="rr-input" placeholder="you@example.com"></div>
                    <div class="rr-field"><label class="rr-label">Request Type</label><select id="requestType" class="rr-select"><option value="return">Return</option><option value="exchange">Exchange</option></select></div>
                    <div class="rr-field"><label class="rr-label">Reason</label><select id="reason" class="rr-select"><option value="wrong_size">Wrong size</option><option value="damaged">Arrived damaged</option><option value="not_as_described">Not as described</option><option value="changed_mind">Changed my mind</option><option value="other">Other</option></select></div>
                    <div class="rr-field full"><label class="rr-label">Additional details</label><textarea id="comments" class="rr-textarea" placeholder="Add any helpful details (optional)"></textarea></div>
                </div>
                <div class="rr-actions">
                    <button class="rr-btn rr-btn-secondary" id="btnLoad">Load Order</button>
                    <button class="rr-btn rr-btn-primary" id="btnSubmit" disabled>Submit Request</button>
                </div>
                <div class="rr-notice" id="notice"></div>
                <div class="rr-preview" id="orderPreview">
                    <h3>Order Details</h3>
                    <div class="rr-preview-pills"><span class="rr-pill" id="orderStatus">Status: -</span><span class="rr-pill" id="orderTotal">Total: -</span></div>
                    <div class="rr-order-items" id="orderItems"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="products-data.js"></script>
    <script src="backend-bridge.js"></script>
    <script src="page-helpers.js"></script>
    <script>
        var elOrderNumber = document.getElementById('orderNumber');
        var elEmail = document.getElementById('email');
        var elBtnLoad = document.getElementById('btnLoad');
        var elBtnSubmit = document.getElementById('btnSubmit');
        var elNotice = document.getElementById('notice');
        var elPreview = document.getElementById('orderPreview');
        var elItems = document.getElementById('orderItems');
        var elStatus = document.getElementById('orderStatus');
        var elTotal = document.getElementById('orderTotal');
        var elRequestType = document.getElementById('requestType');
        var elReason = document.getElementById('reason');
        var elComments = document.getElementById('comments');
        var loadedOrder = null;

        function setNotice(type, msg) { elNotice.className = 'rr-notice ' + type; elNotice.textContent = msg; }
        function clearNotice() { elNotice.className = 'rr-notice'; elNotice.textContent = ''; }

        function renderOrder(order) {
            elPreview.style.display = 'block';
            elStatus.textContent = 'Status: ' + (order.status || '-');
            elTotal.textContent = 'Total: $' + Number(order.total || 0).toFixed(2);
            elItems.innerHTML = (order.items || []).map(function (item) {
                return '<div class="rr-order-item"><img src="' + (item.image || '') + '" alt="' + (item.name || '') + '" onerror="this.style.display=\'none\'"><div><strong>' + (item.name || 'Item') + '</strong><div class="muted">Qty: ' + (item.quantity || 1) + ' · $' + Number(item.price || 0).toFixed(2) + '</div></div></div>';
            }).join('');
        }

        function loadOrder() {
            clearNotice(); elBtnSubmit.disabled = true; loadedOrder = null;
            var orderNumber = elOrderNumber.value.trim();
            var email = elEmail.value.trim();
            if (!orderNumber || !email) { setNotice('error', 'Please enter order number and email.'); return; }
            var local = window.TrendaryoOrders ? TrendaryoOrders.find(orderNumber) : null;
            if (!local) { setNotice('error', 'Order not found. Double-check the number (e.g. TRD-DEMO-4821).'); return; }
            var orderEmail = ((local.shipping && local.shipping.email) || '').toLowerCase();
            if (orderEmail && orderEmail !== email.toLowerCase()) { setNotice('error', 'Order found, but email does not match.'); return; }
            loadedOrder = {
                orderNumber: local.id, status: local.status, total: local.total, email: email,
                items: (local.items || []).map(function (it) {
                    var cp = window.TrendaryoProducts ? TrendaryoProducts.find(it.id) : null;
                    return { name: it.name, quantity: it.qty || it.quantity || 1, price: it.price, image: cp ? cp.image : '' };
                })
            };
            renderOrder(loadedOrder);
            setNotice('success', 'Order loaded. You can now submit your request.');
            elBtnSubmit.disabled = false;
        }

        function submitRequest() {
            clearNotice();
            if (!loadedOrder) { setNotice('error', 'Please load your order first.'); return; }
            elBtnSubmit.disabled = true;
            try {
                var rma = 'RMA-' + Math.random().toString(36).slice(2, 8).toUpperCase();
                var payload = { rma: rma, orderNumber: loadedOrder.orderNumber, email: elEmail.value.trim(), type: elRequestType.value, reason: elReason.value, comments: elComments.value.trim(), createdAt: new Date().toISOString(), status: 'pending' };
                try { var list = JSON.parse(localStorage.getItem('trendaryo_returns') || '[]'); list.push(payload); localStorage.setItem('trendaryo_returns', JSON.stringify(list)); } catch (e) {}
                setNotice('success', 'Request submitted! RMA: ' + rma + ' — we will email you the return label within 24 hours.');
                elBtnSubmit.textContent = 'Request Submitted';
            } catch (e) { setNotice('error', e.message || 'Failed to submit request'); }
            elBtnSubmit.disabled = false;
        }

        elBtnLoad.addEventListener('click', loadOrder);
        elBtnSubmit.addEventListener('click', submitRequest);
    </script>
    <script>
        function hidePreloader() { var p = document.getElementById('preloader'); if (p) p.classList.add('hidden'); }
        if (document.readyState === 'complete') { setTimeout(hidePreloader, 600); } else { window.addEventListener('load', function () { setTimeout(hidePreloader, 600); }); }
        setTimeout(hidePreloader, 1500);
    </script>
</body>
</html>
