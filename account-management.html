<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management - Trendaryo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="responsive-universal.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --accent: #00f0ff;
            --accent-2: #ff00aa;
            --accent-3: #00ff88;
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(180deg, #0a0a2a, #1a1a40);
            color: #fff;
            min-height: 100vh;
            padding-top: 140px;
            padding-bottom: 2rem;
        }
        
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .btn:hover {
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            border: none;
            color: #000;
            font-weight: 800;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-3), var(--accent));
        }
        
        .btn-danger {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
        }
        
        .btn-danger:hover {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }
        
        .search-box {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem;
            border-radius: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.05);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .accounts-table {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1.5fr 1fr 0.8fr;
            gap: 1rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        
        .table-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1.5fr 1fr 0.8fr;
            gap: 1rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .table-row:hover {
            background: rgba(0, 240, 255, 0.05);
        }
        
        .table-row:last-child {
            border-bottom: none;
        }
        
        .user-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            word-break: break-all;
        }
        
        .user-name {
            font-weight: 600;
            color: var(--accent);
        }
        
        .user-email {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .user-date {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .action-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 107, 107, 0.5);
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        
        .action-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: var(--accent-3);
        }
        
        .message.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
        }
        
        .message.info {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.5);
            color: var(--accent);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 240, 255, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #ff6b6b;
        }
        
        .modal-text {
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .table-header,
            .table-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .table-header {
                display: none;
            }
            
            .table-row {
                padding: 1rem;
                border: 1px solid var(--glass-border);
                margin-bottom: 1rem;
                border-radius: 8px;
            }
            
            .table-row::before {
                content: attr(data-label);
                font-weight: 700;
                color: var(--accent);
                display: block;
                margin-bottom: 0.5rem;
            }
        }
    </style>
    <script src="bg.js"></script>
</head>
<body>
    <script src="components.js"></script>
    <canvas id="three-canvas"></canvas>
    
    <div class="container">
        <div class="header">
            <h1>👥 Account Management</h1>
            <p>View and manage all user accounts</p>
        </div>
        
        <div id="message" class="message"></div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="loadAccounts()">🔄 Refresh</button>
            <button class="btn" onclick="exportAccounts()">📥 Export CSV</button>
            <button class="btn btn-danger" onclick="deleteAllAccounts()">🗑️ Delete All</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name or email..." onkeyup="filterAccounts()">
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalAccounts">0</div>
                <div class="stat-label">Total Accounts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayAccounts">0</div>
                <div class="stat-label">Created Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="thisWeekAccounts">0</div>
                <div class="stat-label">This Week</div>
            </div>
        </div>
        
        <div class="accounts-table">
            <div class="table-header">
                <div>User ID</div>
                <div>Name</div>
                <div>Email</div>
                <div>Created</div>
                <div>Action</div>
            </div>
            <div id="accountsList"></div>
        </div>
    </div>
    
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">⚠️ Delete Account?</div>
            <div class="modal-text">
                <p id="deleteUserName"></p>
                <p style="font-size: 0.9rem; color: rgba(255,255,255,0.6);">This action cannot be undone!</p>
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
    
    <script>
        let allAccounts = [];
        let selectedUserId = null;
        
        /* Local user store - works fully offline. Seed data included so the
           admin dashboard is always presentable. Swap for the /api/admin/users
           endpoint when the backend is live. */
        const AM_KEY = 'trendaryo_demo_users';

        function amUsers() {
            try {
                const raw = JSON.parse(localStorage.getItem(AM_KEY) || 'null');
                if (Array.isArray(raw)) return raw;
            } catch (e) {}
            const seed = [
                { id: 'u-1001', name: 'Sarah K.',        email: 'sarah.k@example.com',      createdAt: new Date(Date.now() - 2 * 864e5).toISOString() },
                { id: 'u-1002', name: 'Marcus T.',       email: 'marcus.t@example.com',     createdAt: new Date(Date.now() - 4 * 864e5).toISOString() },
                { id: 'u-1003', name: 'Priya M.',        email: 'priya.m@example.com',      createdAt: new Date(Date.now() - 6 * 864e5).toISOString() },
                { id: 'u-1004', name: 'Demo Customer',   email: 'demo@trendaryo.com',       createdAt: new Date().toISOString() },
                { id: 'u-1005', name: 'James O.',        email: 'james.o@example.com',      createdAt: new Date(Date.now() - 9 * 864e5).toISOString() }
            ];
            try { localStorage.setItem(AM_KEY, JSON.stringify(seed)); } catch (e) {}
            return seed;
        }

        function amSave(list) {
            try { localStorage.setItem(AM_KEY, JSON.stringify(list)); } catch (e) {}
        }

        function loadAccounts() {
            allAccounts = amUsers();
            updateStats();
            displayAccounts(allAccounts);
            showMessage('Loaded ' + allAccounts.length + ' accounts (offline store)', 'success');
        }

        function confirmDelete() {
            if (!selectedUserId) return;
            allAccounts = allAccounts.filter(u => u.id !== selectedUserId);
            amSave(allAccounts);
            closeDeleteModal();
            showMessage('Account deleted successfully', 'success');
            updateStats();
            displayAccounts(allAccounts);
        }

        function deleteAllAccounts() {
            if (!confirm('Delete ALL accounts? This cannot be undone!')) return;
            if (!confirm('Are you absolutely sure? This will delete all user accounts!')) return;
            allAccounts = [];
            amSave([]);
            showMessage('All accounts deleted', 'success');
            updateStats();
            displayAccounts([]);
        }
        function exportAccounts() {
            if (allAccounts.length === 0) {
                showMessage('❌ No accounts to export', 'error');
                return;
            }
            
            const headers = ['ID', 'Name', 'Email', 'Created Date'];
            const rows = allAccounts.map(u => [
                u.id,
                u.name,
                u.email,
                new Date(u.createdAt).toLocaleString()
            ]);
            
            const csv = [headers, ...rows]
                .map(row => row.map(cell => `"${cell}"`).join(','))
                .join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `accounts_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            showMessage('✅ Accounts exported successfully', 'success');
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message show ${type}`;
            setTimeout(() => {
                messageDiv.classList.remove('show');
            }, 5000);
        }
        
        // Load accounts on page load
        window.addEventListener('load', loadAccounts);
    </script>
</body>
</html>
