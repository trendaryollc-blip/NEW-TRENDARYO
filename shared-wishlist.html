<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Wishlist - Trendaryo</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://trendaryo.com/shared-wishlist.html">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-crown-star.svg">
    <link rel="stylesheet" href="responsive-universal.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <script src="performance.js"></script>
    <script src="bg.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0a0a; --bg-deep: #0a0a2a;
            --accent: #00f0ff; --accent-2: #ff00aa; --accent-3: #00ff88;
            --text: #ffffff; --muted: rgba(255,255,255,0.66); --muted-2: rgba(255,255,255,0.45);
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1); --glass-border-2: rgba(255,255,255,0.18);
            --card-grad: linear-gradient(168deg, rgba(255,255,255,0.075), rgba(255,255,255,0.02));
            --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --font-d: 'Orbitron', sans-serif; --font-b: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-b); background: var(--bg-deep); color: #fff; overflow-x: hidden; }
        #three-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .page-offset { padding-top: 190px; padding-bottom: 3rem; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
        .sw-shell { max-width: 1100px; margin: 0 auto; padding: 0 2.5rem; }

        .sw-hero { text-align: center; padding: 2rem; background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); margin-bottom: 2.5rem; }
        .sw-hero h1 { font-family: var(--font-d); font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; background: linear-gradient(135deg, #fff, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        .sw-hero p { color: var(--muted); font-size: 1rem; margin-bottom: 0.5rem; }
        .sw-hero .sw-share { color: var(--accent-3); font-size: 0.88rem; }

        .sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
        .sw-card { background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); overflow: hidden; transition: transform 0.3s var(--ease), border-color 0.3s; }
        .sw-card:hover { transform: translateY(-4px); border-color: rgba(0,240,255,0.4); box-shadow: 0 16px 40px rgba(0,0,0,0.35); }
        .sw-card-img { position: relative; height: 220px; overflow: hidden; }
        .sw-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .sw-card:hover .sw-card-img img { transform: scale(1.05); }
        .sw-card-body { padding: 1.25rem; }
        .sw-card-name { font-family: var(--font-d); font-size: 0.95rem; font-weight: 700; margin-bottom: 0.3rem; }
        .sw-card-price { font-family: var(--font-d); font-size: 1.15rem; font-weight: 800; color: var(--accent); margin-bottom: 0.8rem; }
        .sw-card-price .old { color: var(--muted-2); text-decoration: line-through; margin-right: 0.5rem; font-size: 0.9rem; }
        .sw-card-btn { display: block; width: 100%; padding: 0.75rem; border: 0; border-radius: var(--r-sm); background: linear-gradient(135deg, var(--accent), var(--accent-3)); color: #00202a; font-family: var(--font-d); font-size: 0.68rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: none; text-align: center; transition: all 0.25s; }
        .sw-card-btn:hover { box-shadow: 0 0 20px rgba(0,240,255,0.4); transform: translateY(-1px); }

        .sw-empty { text-align: center; padding: 4rem 2rem; }
        .sw-empty h2 { font-family: var(--font-d); font-size: 1.5rem; margin-bottom: 0.5rem; }
        .sw-empty p { color: var(--muted); margin-bottom: 1.5rem; }

        .sw-cta { text-align: center; padding: 2rem; background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); }
        .sw-cta h3 { font-family: var(--font-d); font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--accent); }
        .sw-cta p { color: var(--muted); margin-bottom: 1.25rem; }
        .sw-cta-btn { padding: 0.85rem 2rem; border: 0; border-radius: var(--r-md); background: linear-gradient(135deg, var(--accent-2), var(--accent-3)); color: #fff; font-family: var(--font-d); font-size: 0.72rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: all 0.25s; }
        .sw-cta-btn:hover { box-shadow: 0 0 20px rgba(255,0,170,0.4); transform: translateY(-1px); }

        @media(max-width:900px){
            .page-offset{padding-top:130px;}
            .sw-shell{padding:1.5rem;}
        }
        @media(max-width:600px){
            body{padding-top:110px;}
            .sw-shell{padding:1rem;}
            .sw-hero{padding:2rem 1rem 1.75rem;}
        }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <div id="header-container"></div>
    <script src="components.js"></script>

    <main class="page-offset">
        <div class="sw-shell">
            <div class="sw-hero">
                <h1 id="wishlistTitle">My Trendaryo Wishlist</h1>
                <p id="wishlistDescription">Check out these amazing products I've found!</p>
                <div class="sw-share">Shared via Trendaryo Wishlist</div>
            </div>
            <div class="sw-grid" id="sharedGrid"></div>
            <div class="sw-empty" id="emptyState" style="display:none;">
                <h2>No Products Found</h2>
                <p>This wishlist is empty or the link is invalid.</p>
                <a href="shop.html" class="sw-cta-btn">Start Shopping</a>
            </div>
            <div class="sw-cta">
                <h3 style="font-family:var(--font-d);font-size:1.1rem;margin-bottom:0.5rem;">Create Your Own Wishlist</h3>
                <p style="color:var(--muted);margin-bottom:1rem;">Love these products? Create your own wishlist and share it with friends!</p>
                <a href="shop.html" class="sw-cta-btn">Start Shopping</a>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="products-data.js"></script>
    <script src="backend-bridge.js"></script>
    <script src="page-helpers.js"></script>
    <script>
        (function () {
            var grid = document.getElementById('sharedGrid');
            var empty = document.getElementById('emptyState');
            var UI = window.TrendaryoUI;
            try {
                var params = new URLSearchParams(window.location.search);
                var data = params.get('data');
                if (data) {
                    var items = JSON.parse(decodeURIComponent(data));
                    if (items.length > 0 && UI) {
                        grid.innerHTML = items.map(function (p) { return UI.productMini(p); }).join('');
                        UI.bindMiniCards(grid);
                    } else { empty.style.display = 'block'; }
                } else { empty.style.display = 'block'; }
            } catch (e) { empty.style.display = 'block'; }
        })();
    </script>
    <script>
        function hidePreloader() { var p = document.getElementById('preloader'); if (p) p.classList.add('hidden'); }
        if (document.readyState === 'complete') { setTimeout(hidePreloader, 600); } else { window.addEventListener('load', function () { setTimeout(hidePreloader, 600); }); }
        setTimeout(hidePreloader, 1500);
    </script>
</body>
</html>
