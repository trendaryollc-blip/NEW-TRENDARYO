<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a free Trendaryo account to enjoy faster checkout, order tracking, wishlist, and exclusive offers.">
    <meta name="keywords" content="register, sign up, create account">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="Trendaryo">
    <link rel="canonical" href="https://trendaryo.com/register.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trendaryo.com/register.html">
    <meta property="og:title" content="Create Account - Trendaryo">
    <meta property="og:description" content="Create a free Trendaryo account to enjoy faster checkout, order tracking, wishlist, and exclusive offers.">
    <meta property="og:image" content="https://trendaryo.com/assets/trendaryo-crown-star-logo.svg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://trendaryo.com/register.html">
    <meta property="twitter:title" content="Create Account - Trendaryo">
    <meta property="twitter:description" content="Create a free Trendaryo account to enjoy faster checkout, order tracking, wishlist, and exclusive offers.">
    <meta property="twitter:image" content="https://trendaryo.com/assets/trendaryo-crown-star-logo.svg">
    <title>Create Account - Trendaryo</title>
    <link rel="stylesheet" href="responsive.css">
    <script src="performance.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        :root{--accent:#00f0ff;--accent-2:#ff00aa;--glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Rajdhani',sans-serif;background:linear-gradient(180deg,#0a0a2a,#1a1a40);color:#fff;min-height:100vh;padding-top:140px;padding-bottom:2rem;}
        .register-wrapper{display:flex;align-items:center;justify-content:center;padding:2rem;min-height:calc(100vh - 140px);}
        .register-container{max-width:450px;width:100%;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:3rem;backdrop-filter:blur(10px);}
        .logo{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent-2));background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:2rem;}
        h1{font-family:'Orbitron',sans-serif;text-align:center;margin-bottom:2rem;font-size:1.8rem;}
        .form-group{margin-bottom:1.5rem;}
        .form-group label{display:block;margin-bottom:0.5rem;color:#ccc;}
        .form-group input{width:100%;padding:0.8rem;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border);color:#fff;font-family:inherit;font-size:1rem;}
        .form-group input:focus{outline:none;border-color:var(--accent);}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
        .btn{width:100%;padding:1rem;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:inherit;font-size:1rem;background:var(--accent);color:#000;}
        .btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,240,255,0.3);}
        .btn:disabled{opacity:0.5;cursor:not-allowed;}
        .divider{text-align:center;margin:1.5rem 0;color:#888;position:relative;}
        .divider:before,.divider:after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--glass-border);}
        .divider:before{left:0;}
        .divider:after{right:0;}
        .links{text-align:center;margin-top:1.5rem;}
        .links a{color:var(--accent);text-decoration:none;}
        .links a:hover{text-decoration:underline;}
        .error{background:rgba(255,0,0,0.2);border:1px solid #ff0000;color:#ff6666;padding:0.8rem;border-radius:8px;margin-bottom:1rem;display:none;font-size:0.9rem;line-height:1.4;}
        .error.show{display:block;}
        .success{background:rgba(0,255,136,0.2);border:1px solid #00ff88;color:#00ff88;padding:0.8rem;border-radius:8px;margin-bottom:1rem;display:none;font-size:0.9rem;}
        .success.show{display:block;}
        .info-box{background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);color:rgba(255,255,255,0.8);padding:0.8rem;border-radius:8px;margin-bottom:1rem;display:none;font-size:0.85rem;}
        .info-box.show{display:block;}
    </style>
<script src="bg.js"></script>
</head>
<body>
    <script src="components.js"></script>
    <canvas id="three-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;"></canvas>
    <div class="register-wrapper">
    <div class="register-container">
        <div class="logo">TRENDARYO</div>
        <h1>Create Account</h1>
        <div style="background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.3);border-radius:14px;padding:1rem 1.25rem;margin:0 0 1.5rem;text-align:left;">
            <div style="font-family:Orbitron,sans-serif;font-size:0.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-3,#00ff88);margin-bottom:0.5rem;">Joining free — you instantly get</div>
            <div style="color:rgba(255,255,255,0.75);font-size:0.9rem;line-height:1.9;">
                ★ 100 welcome points (that's $1 credit)<br>
                ★ WELCOME10 — 10% off your first order<br>
                ★ Saved addresses, wishlist & faster checkout
            </div>
        </div>
        
        <div class="info-box" id="info-message"></div>
        <div class="error" id="error-message"></div>
        <div class="success" id="success-message"></div>
        
        <form id="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn" id="register-btn">Create Account</button>
        </form>
        
        <div class="divider">OR</div>
        
        <div class="links">
            <p>Already have an account? <a href="login.html">Login</a></p>
            <p style="margin-top:0.5rem;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-auth-helper.js"></script>
    
    <script>
        var auth, db;
        
        window.addEventListener('load', async function() {
            try {
                if (typeof initFirebase === 'function') {
                    var firebase = await initFirebase();
                    auth = firebase.auth;
                    db = firebase.db;
                    
                    if (!auth || !db) {
                        var errorDiv = document.getElementById('error-message');
                        errorDiv.textContent = 'Firebase not initialized. Please check your internet connection and refresh.';
                        errorDiv.classList.add('show');
                    }
                }
            } catch (err) {
                console.error('Firebase init error:', err);
            }
        });

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var firstName = document.getElementById('firstName').value.trim();
            var lastName = document.getElementById('lastName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var btn = document.getElementById('register-btn');
            var errorDiv = document.getElementById('error-message');
            var successDiv = document.getElementById('success-message');
            
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            if (!firstName || !lastName) {
                errorDiv.textContent = 'First name and last name are required';
                errorDiv.classList.add('show');
                return;
            }
            
            if (!email) {
                errorDiv.textContent = 'Email is required';
                errorDiv.classList.add('show');
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.classList.add('show');
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            
            try {
                var result = await FirebaseAuth.register(email, password, firstName, lastName);
                
                if (result.success) {
                    successDiv.textContent = 'Account created successfully! Redirecting...';
                    successDiv.classList.add('show');
                    
                    if (window.updateAccountMenu) {
                        window.updateAccountMenu();
                    }
                    
                    setTimeout(function() {
                        window.location.href = 'shop.html';
                    }, 1500);
                }
            } catch (err) {
                console.error('Registration error:', err);
                
                var errorMessage = 'Registration failed';
                
                if (err.code === 'auth/email-already-in-use') {
                    errorMessage = 'This email is already registered. Please login instead.';
                } else if (err.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address';
                } else if (err.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Use at least 6 characters.';
                } else if (err.message) {
                    errorMessage = err.message;
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
    <!-- Self-Healing System -->
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  console.log('Error caught:', msg);
  const errorDiv = document.createElement('div');
  errorDiv.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#f3f4f6; padding:10px; border-radius:5px; z-index:9999; border:1px solid #ccc;';
  errorDiv.innerHTML = '⚠️ Something went wrong. Retrying...';
  document.body.appendChild(errorDiv);
  setTimeout(() => errorDiv.remove(), 3000);
  return false;
};
</script>
</body>
</html>
