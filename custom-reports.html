<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Reports - Admin - Trendaryo</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="responsive-universal.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            background: linear-gradient(135deg, #00f0ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .btn.primary {
            background: rgba(0, 255, 136, 0.2);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .btn.primary:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #00f0ff;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: #ff00aa;
        }

        .tab-btn.active {
            border-bottom-color: #00f0ff;
            color: #00f0ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2em;
            color: #00f0ff;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #00f0ff;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #e0e0e0;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .report-card {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-info {
            flex: 1;
        }

        .report-name {
            color: #00f0ff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .report-meta {
            font-size: 0.9em;
            color: #808080;
        }

        .report-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(0, 240, 255, 0.1);
            padding: 12px;
            text-align: left;
            color: #00f0ff;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
        }

        tr:hover {
            background: rgba(0, 240, 255, 0.05);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00f0ff;
        }

        .spinner {
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top: 3px solid #00f0ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .error-message {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.3);
            color: #ff0055;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .report-card {
                flex-direction: column;
                gap: 15px;
            }

            .report-actions {
                width: 100%;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📋 Custom Reports</h1>
            <div class="header-actions">
                <button class="btn" onclick="goBack()">← Back</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('builder')">Report Builder</button>
            <button class="tab-btn" onclick="switchTab('saved')">Saved Reports</button>
            <button class="tab-btn" onclick="switchTab('scheduled')">Scheduled</button>
        </div>

        <!-- Report Builder Tab -->
        <div id="builder" class="tab-content active">
            <div class="section">
                <div class="section-title">Create New Report</div>
                <div id="builderMessage"></div>

                <div class="form-group">
                    <label>Report Name</label>
                    <input type="text" id="reportName" placeholder="e.g., Monthly Sales Report">
                </div>

                <div class="form-group">
                    <label>Report Type</label>
                    <select id="reportType" onchange="updateMetricsOptions()">
                        <option value="sales">Sales Report</option>
                        <option value="customer">Customer Report</option>
                        <option value="product">Product Report</option>
                        <option value="custom">Custom Metrics</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date Range</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <input type="date" id="startDate">
                        <input type="date" id="endDate">
                    </div>
                </div>

                <div class="form-group">
                    <label>Metrics to Include</label>
                    <div class="checkbox-group" id="metricsCheckboxes">
                        <div class="checkbox-item">
                            <input type="checkbox" id="metric_revenue" checked>
                            <label for="metric_revenue">Revenue</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="metric_orders" checked>
                            <label for="metric_orders">Orders</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="metric_customers" checked>
                            <label for="metric_customers">Customers</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="metric_aov">
                            <label for="metric_aov">Avg Order Value</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="metric_conversion">
                            <label for="metric_conversion">Conversion Rate</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="metric_retention">
                            <label for="metric_retention">Retention Rate</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Filters (Optional)</label>
                    <textarea id="reportFilters" placeholder="e.g., category=electronics, status=completed" rows="3"></textarea>
                </div>

                <div class="button-group">
                    <button class="btn primary" onclick="generateReport()">📊 Generate Report</button>
                    <button class="btn" onclick="saveReportTemplate()">💾 Save as Template</button>
                </div>
            </div>

            <div class="section" id="reportPreview" style="display: none;">
                <div class="section-title">Report Preview</div>
                <div id="previewContent"></div>
                <div class="button-group">
                    <button class="btn primary" onclick="exportReportPDF()">📥 Export as PDF</button>
                    <button class="btn primary" onclick="exportReportExcel()">📥 Export as Excel</button>
                    <button class="btn" onclick="emailReport()">📧 Email Report</button>
                </div>
            </div>
        </div>

        <!-- Saved Reports Tab -->
        <div id="saved" class="tab-content">
            <div class="section">
                <div class="section-title">Saved Reports</div>
                <div id="savedReportsList">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scheduled Reports Tab -->
        <div id="scheduled" class="tab-content">
            <div class="section">
                <div class="section-title">Schedule New Report</div>
                <div id="scheduleMessage"></div>

                <div class="form-group">
                    <label>Report Template</label>
                    <select id="scheduleTemplate">
                        <option value="">Select a saved report...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Frequency</label>
                    <select id="scheduleFrequency">
                        <option value="daily">Daily</option>
                        <option value="weekly" selected>Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Send To (Email)</label>
                    <input type="email" id="scheduleEmail" placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label>Send Time</label>
                    <input type="time" id="scheduleTime" value="09:00">
                </div>

                <button class="btn primary" onclick="scheduleReport()">⏰ Schedule Report</button>
            </div>

            <div class="section">
                <div class="section-title">Active Schedules</div>
                <div id="scheduledReportsList">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-manager.js"></script>
    <script src="analytics-engine.js"></script>
    <script>
        let currentReport = null;

        // Check admin access
        function checkAdminAccess() {
            if (!window.AdminManager.isAdmin()) {
                alert('Access denied. Admin privileges required.');
                window.location.href = 'admin-login.html';
            }
        }

        // Switch tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'saved') {
                loadSavedReports();
            } else if (tabName === 'scheduled') {
                loadScheduledReports();
            }
        }

        // Update metrics options based on report type
        function updateMetricsOptions() {
            const type = document.getElementById('reportType').value;
            // Metrics can be dynamically updated based on type
            console.log('Report type changed to:', type);
        }

        // Generate report
        async function generateReport() {
            const name = document.getElementById('reportName').value;
            const type = document.getElementById('reportType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!name || !startDate || !endDate) {
                showMessage('builderMessage', 'Please fill in all required fields', 'error');
                return;
            }

            try {
                const metrics = getSelectedMetrics();
                const config = {
                    title: name,
                    type,
                    startDate,
                    endDate,
                    metrics,
                    filters: document.getElementById('reportFilters').value
                };

                const report = await window.AnalyticsEngine.generateCustomReport(config);
                currentReport = report;
                displayReportPreview(report);
                showMessage('builderMessage', 'Report generated successfully!', 'success');
            } catch (error) {
                console.error('Error generating report:', error);
                showMessage('builderMessage', 'Error generating report', 'error');
            }
        }

        // Get selected metrics
        function getSelectedMetrics() {
            const metrics = [];
            document.querySelectorAll('input[id^="metric_"]:checked').forEach(checkbox => {
                metrics.push(checkbox.id.replace('metric_', ''));
            });
            return metrics;
        }

        // Display report preview
        function displayReportPreview(report) {
            const preview = document.getElementById('reportPreview');
            const content = document.getElementById('previewContent');

            content.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #00f0ff; margin-bottom: 10px;">${report.title}</h3>
                    <p style="color: #808080; font-size: 0.9em;">Generated: ${new Date(report.generatedAt).toLocaleString()}</p>
                </div>
                <div style="background: rgba(0, 240, 255, 0.05); padding: 15px; border-radius: 5px; margin-bottom: 15px;">
                    <h4 style="color: #00f0ff; margin-bottom: 10px;">Summary</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                        ${Object.entries(report.summary || {}).map(([key, value]) => `
                            <div>
                                <div style="color: #808080; font-size: 0.9em;">${key}</div>
                                <div style="color: #00f0ff; font-weight: bold;">${value}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div style="background: rgba(0, 240, 255, 0.05); padding: 15px; border-radius: 5px;">
                    <h4 style="color: #00f0ff; margin-bottom: 10px;">Data</h4>
                    <p style="color: #808080;">Records: ${(report.data || []).length}</p>
                </div>
            `;

            preview.style.display = 'block';
        }

        // Save report template
        async function saveReportTemplate() {
            const name = document.getElementById('reportName').value;
            if (!name) {
                showMessage('builderMessage', 'Please enter a report name', 'error');
                return;
            }

            try {
                const config = {
                    title: name,
                    type: document.getElementById('reportType').value,
                    metrics: getSelectedMetrics(),
                    filters: document.getElementById('reportFilters').value
                };

                // Save to localStorage for now
                const templates = JSON.parse(localStorage.getItem('reportTemplates') || '[]');
                templates.push(config);
                localStorage.setItem('reportTemplates', JSON.stringify(templates));

                showMessage('builderMessage', 'Report template saved successfully!', 'success');
            } catch (error) {
                console.error('Error saving template:', error);
                showMessage('builderMessage', 'Error saving template', 'error');
            }
        }

        // Export report to PDF
        async function exportReportPDF() {
            if (!currentReport) return;
            try {
                await window.AnalyticsEngine.exportToPDF(currentReport.reportId, currentReport.title);
                showMessage('builderMessage', 'Report exported as PDF', 'success');
            } catch (error) {
                console.error('Error exporting PDF:', error);
                showMessage('builderMessage', 'Error exporting PDF', 'error');
            }
        }

        // Export report to Excel
        async function exportReportExcel() {
            if (!currentReport) return;
            try {
                await window.AnalyticsEngine.exportToExcel(currentReport.reportId, currentReport.title);
                showMessage('builderMessage', 'Report exported as Excel', 'success');
            } catch (error) {
                console.error('Error exporting Excel:', error);
                showMessage('builderMessage', 'Error exporting Excel', 'error');
            }
        }

        // Email report
        async function emailReport() {
            if (!currentReport) return;
            const email = prompt('Enter email address:');
            if (!email) return;

            try {
                await window.AnalyticsEngine.emailReport(currentReport.reportId, [email], currentReport.title);
                showMessage('builderMessage', 'Report sent via email', 'success');
            } catch (error) {
                console.error('Error emailing report:', error);
                showMessage('builderMessage', 'Error emailing report', 'error');
            }
        }

        // Load saved reports
        async function loadSavedReports() {
            try {
                const reports = await window.AnalyticsEngine.getSavedReports();
                displaySavedReports(reports);
            } catch (error) {
                console.error('Error loading saved reports:', error);
            }
        }

        // Display saved reports
        function displaySavedReports(reports) {
            const list = document.getElementById('savedReportsList');
            if (!reports || reports.length === 0) {
                list.innerHTML = '<p style="color: #808080;">No saved reports yet</p>';
                return;
            }

            list.innerHTML = reports.map(report => `
                <div class="report-card">
                    <div class="report-info">
                        <div class="report-name">${report.title}</div>
                        <div class="report-meta">Created: ${new Date(report.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div class="report-actions">
                        <button class="btn btn-small" onclick="viewReport('${report.id}')">View</button>
                        <button class="btn btn-small" onclick="deleteReport('${report.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Load scheduled reports
        async function loadScheduledReports() {
            try {
                const schedules = await window.AnalyticsEngine.getActiveAlerts();
                displayScheduledReports(schedules);
            } catch (error) {
                console.error('Error loading scheduled reports:', error);
            }
        }

        // Display scheduled reports
        function displayScheduledReports(schedules) {
            const list = document.getElementById('scheduledReportsList');
            if (!schedules || schedules.length === 0) {
                list.innerHTML = '<p style="color: #808080;">No scheduled reports</p>';
                return;
            }

            list.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Report</th>
                            <th>Frequency</th>
                            <th>Next Run</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${schedules.map(schedule => `
                            <tr>
                                <td>${schedule.title}</td>
                                <td>${schedule.frequency}</td>
                                <td>${new Date(schedule.nextRun).toLocaleString()}</td>
                                <td>
                                    <button class="btn btn-small" onclick="deleteSchedule('${schedule.id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Schedule report
        async function scheduleReport() {
            const template = document.getElementById('scheduleTemplate').value;
            const frequency = document.getElementById('scheduleFrequency').value;
            const email = document.getElementById('scheduleEmail').value;
            const time = document.getElementById('scheduleTime').value;

            if (!template || !email) {
                showMessage('scheduleMessage', 'Please fill in all required fields', 'error');
                return;
            }

            try {
                const config = {
                    templateId: template,
                    frequency,
                    recipients: [email],
                    time
                };

                await window.AnalyticsEngine.scheduleReport(config);
                showMessage('scheduleMessage', 'Report scheduled successfully!', 'success');
                loadScheduledReports();
            } catch (error) {
                console.error('Error scheduling report:', error);
                showMessage('scheduleMessage', 'Error scheduling report', 'error');
            }
        }

        // Delete report
        async function deleteReport(reportId) {
            if (!confirm('Are you sure you want to delete this report?')) return;
            try {
                await window.AnalyticsEngine.deleteReport(reportId);
                loadSavedReports();
            } catch (error) {
                console.error('Error deleting report:', error);
            }
        }

        // Show message
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            const className = type === 'error' ? 'error-message' : 'success-message';
            element.innerHTML = `<div class="${className}">${message}</div>`;
            setTimeout(() => {
                element.innerHTML = '';
            }, 5000);
        }

        // Go back
        function goBack() {
            window.location.href = 'admin-dashboard-enhanced.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAccess();
            // Set default dates
            const today = new Date();
            const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
            document.getElementById('startDate').value = lastMonth.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
        });
    </script>
</body>
</html>
