<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trendaryo Blog — Article</title>
<meta name="description" content="Read the latest Trendaryo blog articles on fashion, technology, lifestyle and buying guides.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://trendaryo.com/blog-post.html">
<link rel="icon" href="assets/favicon-crown-star.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="responsive-universal.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="styles.css">
<style>
body{font-family:'Rajdhani',sans-serif;background:transparent;color:#fff;min-height:100vh;display:flex;flex-direction:column;}
.page-offset{padding-top:180px;}
.bp-wrap{max-width:860px;margin:0 auto;padding:1rem 1.25rem 2.5rem;width:100%;}
.bp-card{border:1px solid rgba(255,255,255,0.1);border-radius:20px;background:rgba(255,255,255,0.03);overflow:hidden;}
.bp-cover{width:100%;aspect-ratio:2/1;object-fit:cover;display:block;}
.bp-body{padding:1.75rem 2rem;}
.bp-cat{display:inline-block;background:transparent;color:#000;padding:0.25rem 0.9rem;border-radius:20px;font-size:0.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:1rem;}
.bp-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,3.5vw,2.1rem);font-weight:900;line-height:1.25;margin-bottom:0.9rem;background:linear-gradient(135deg,#fff,var(--accent));background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.bp-meta{display:flex;gap:1rem;flex-wrap:wrap;color:rgba(255,255,255,0.55);font-size:0.9rem;margin-bottom:1.5rem;}
.bp-meta b{color:rgba(255,255,255,0.85);font-weight:600;}
.bp-body p{color:rgba(255,255,255,0.82);line-height:1.75;font-size:1.05rem;margin-bottom:1.1rem;}
.bp-h2{font-family:'Orbitron',sans-serif;font-size:1.05rem;letter-spacing:1px;color:var(--accent);text-transform:uppercase;margin:1.6rem 0 0.8rem;}
.bp-list{margin:0 0 1.1rem 1.2rem;color:rgba(255,255,255,0.82);line-height:1.75;font-size:1.05rem;}
.bp-back{display:inline-flex;align-items:center;gap:0.5rem;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:1rem;transition:gap 0.2s ease;}
.bp-back:hover{gap:0.8rem;}
.bp-missing{font-family:'Orbitron',sans-serif;font-size:1.1rem;text-align:center;padding:3rem 1rem;color:rgba(255,255,255,0.6);}
.bp-h3{font-family:'Orbitron',sans-serif;font-size:0.95rem;color:rgba(255,255,255,0.9);margin:1.2rem 0 0.6rem;}
.bp-quote{border-left:3px solid var(--accent);padding:0.4rem 0 0.4rem 1rem;margin:1.2rem 0;color:rgba(255,255,255,0.9);font-style:italic;}
.bp-quote cite{display:block;margin-top:0.4rem;font-size:0.85rem;color:rgba(255,255,255,0.5);font-style:normal;}
.bp-fig{margin:1.2rem 0;}
.bp-fig img{width:100%;border-radius:12px;display:block;}
.bp-fig figcaption{font-size:0.85rem;color:rgba(255,255,255,0.55);margin-top:0.4rem;}
.bp-cta{border:1px dashed rgba(255,255,255,0.2);border-radius:16px;padding:1.5rem;text-align:center;margin:1.5rem 0;}
.bp-cta__t{font-family:'Orbitron',sans-serif;font-weight:700;margin-bottom:0.4rem;}
.bp-cta__x{color:rgba(255,255,255,0.75);margin-bottom:1rem;font-size:0.95rem;}
.bp-cta__btn{display:inline-block;padding:0.7rem 1.6rem;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#000;font-family:'Orbitron',sans-serif;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:1px;font-size:0.85rem;}
.bp-prod{display:flex;align-items:center;gap:1rem;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:0.85rem 1rem;margin:0.8rem 0;background:rgba(255,255,255,0.03);text-decoration:none;color:#fff;transition:border-color .25s ease,transform .25s ease;}
.bp-prod:hover{border-color:var(--accent);transform:translateY(-2px);}
.bp-prod img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:0 0 52px;}
.bp-prod__n{flex:1;min-width:0;font-weight:600;}
.bp-prod__p{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--accent);white-space:nowrap;}
.bp-prod--empty{color:rgba(255,255,255,0.5);border-style:dashed;}
.bp-rel{margin-top:2rem;border-top:1px solid rgba(255,255,255,0.1);padding-top:1.2rem;}
.bp-rel h2{font-family:'Orbitron',sans-serif;font-size:1.05rem;margin-bottom:0.8rem;}
.bp-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;}
.bp-nav a{flex:1;min-width:200px;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:0.9rem 1rem;text-decoration:none;color:#fff;background:rgba(255,255,255,0.03);transition:border-color .25s ease;}
.bp-nav a:hover{border-color:var(--accent);}
.bp-nav .k{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.5);}
.bp-nav .t{font-weight:600;margin-top:0.2rem;}
.bp-nav .next{text-align:right;}
.bp-tags{display:flex;gap:0.5rem;flex-wrap:wrap;margin:0 0 1.2rem;}
.bp-tag{background:rgba(0,240,255,0.1);border:1px solid var(--accent);color:var(--accent);padding:0.2rem 0.7rem;border-radius:15px;font-size:0.78rem;}
.bp-offline{background:rgba(255,180,0,0.12);border:1px solid rgba(255,180,0,0.4);border-radius:10px;padding:0.5rem 0.9rem;font-size:0.85rem;color:#ffd27a;margin-bottom:1rem;}
@media(max-width:768px){
    .page-offset{padding-top:130px;}
    .bp-wrap{padding:0.75rem 1rem 3rem;}
    .bp-body{padding:1.25rem 1.25rem 1.5rem;}
    .bp-title{font-size:clamp(1.2rem,5vw,1.7rem);}
    .bp-body p{font-size:0.95rem;}
    .bp-meta{font-size:0.82rem;gap:0.6rem;}
}
@media(max-width:480px){
    .page-offset{padding-top:110px;}
    .bp-wrap{padding:0.5rem 0.75rem 2.5rem;}
    .bp-body{padding:1rem;}
    .bp-cover{aspect-ratio:16/9;}
}
</style>
</head>
<body>
<div class="preloader-3d" id="preloader"><div class="preloader-logo-3d">TRENDARYO</div><div class="preloader-spinner-3d"></div></div>
<div id="header-container" data-type="full"></div>

<main class="page-offset">
    <div class="bp-wrap">
        <a class="bp-back" href="blog.html">&larr; Back to Blog</a>
        <article class="bp-card" id="postContent"></article>
    </div>
</main>

<div id="footer-container"></div>
<script src="products-data.js"></script>
<script src="api-client.js"></script>
    <script src="blog-blocks.js"></script>
    <script src="blog-schema.js"></script>
<script src="components.js"></script>
<script>
(function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var slug = (params.get('slug') || params.get('id') || '').trim();
    var el = document.getElementById('postContent');
    var SITE = 'https://trendaryo.com';

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function missing(msg) {
        el.innerHTML = '<div class="bp-missing"><p>' + esc(msg || 'Article not found.') + '</p>' +
            '<p style="font-size:0.9rem;margin-top:1rem;"><a href="blog.html" style="color:var(--accent);">Browse all articles</a></p></div>';
    }

    function setMeta(post) {
        var seo = post.seo || {};
        var title = (seo.metaTitle || post.title) + ' — Trendaryo Blog';
        var desc = seo.metaDescription || post.excerpt || 'Read the latest Trendaryo blog article.';
        var image = seo.ogImage && /^https?:/i.test(seo.ogImage) ? seo.ogImage : (post.coverImage || SITE + '/assets/trendaryo-crown-star-logo.svg');
        var url = SITE + '/blog-post.html?slug=' + encodeURIComponent(post.slug || post.id);

        document.title = title;
        setTag('meta[name="description"]', 'content', desc);
        setTag('link[rel="canonical"]', 'href', url);
        setTag('meta[property="og:type"]', 'content', 'article');
        setTag('meta[property="og:url"]', 'content', url);
        setTag('meta[property="og:title"]', 'content', title);
        setTag('meta[property="og:description"]', 'content', desc);
        setTag('meta[property="og:image"]', 'content', image);
        setTag('meta[property="twitter:card"]', 'content', 'summary_large_image');
        setTag('meta[property="twitter:title"]', 'content', title);
        setTag('meta[property="twitter:description"]', 'content', desc);
        setTag('meta[property="twitter:image"]', 'content', image);

        /* JSON-LD: prefer the publish-time graph (Article + FAQ + Breadcrumb),
           generated by the server from the approved post. */
        var old = document.getElementById('blog-jsonld');
        if (old) old.remove();
        var s = document.createElement('script');
        s.type = 'application/ld+json';
        s.id = 'blog-jsonld';
        if (seo.schema && window.TrendaryoBlogSchema) {
            s.textContent = window.TrendaryoBlogSchema.safeJson(seo.schema);
        } else {
            var ld = {
                '@context': 'https://schema.org',
                '@type': 'Article',
                headline: post.title || '',
                description: desc,
                image: image,
                url: url,
                author: { '@type': 'Organization', name: post.author || 'Trendaryo Editorial' },
                publisher: {
                    '@type': 'Organization',
                    name: 'Trendaryo',
                    logo: { '@type': 'ImageObject', url: SITE + '/assets/trendaryo-crown-star-logo.svg' }
                },
                datePublished: post.publishedAt || post.createdAt || undefined,
                dateModified: post.updatedAt || undefined,
                mainEntityOfPage: url
            };
            if (seo.keywords && seo.keywords.length) ld.keywords = seo.keywords.join(', ');
            s.textContent = JSON.stringify(ld);
        }
        document.head.appendChild(s);
    }

    function setTag(sel, attrName, value) {
        var node = document.querySelector(sel);
        if (!node) {
            if (sel.indexOf('link[') === 0) {
                node = document.createElement('link');
                node.rel = 'canonical';
            } else {
                node = document.createElement('meta');
                var m = sel.match(/meta\[(name|property)="([^"]+)"\]/);
                if (m) node.setAttribute(m[1], m[2]);
            }
            document.head.appendChild(node);
        }
        node.setAttribute(attrName, value);
    }

    function productCard(pid) {       var P = window.TrendaryoProducts;
        var p = P && P.find ? P.find(pid) : null;
        if (!p) return '<div class="bp-prod bp-prod--empty">Product #' + esc(pid) + '</div>';
        var img = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">' : '';
        var price = typeof p.price === 'number' ? '$' + p.price : '';
        return '<a class="bp-prod" href="product.html?id=' + esc(p.id) + '">' + img +
            '<span class="bp-prod__n">' + esc(p.name) + '</span><span class="bp-prod__p">' + esc(price) + '</span></a>';
    }

    function relatedHtml(ids) {
        if (!ids || !ids.length) return '';
        var h = '';
        for (var i = 0; i < ids.length; i++) h += productCard(ids[i]);
        if (!h) return '';
        return '<div class="bp-rel"><h2>Products from this guide</h2>' + h + '</div>';
    }

    function navHtml(prev, next) {
        if (!prev && !next) return '';
        var h = '<div class="bp-nav">';
        if (prev) {
            h += '<a class="prev" href="blog-post.html?slug=' + encodeURIComponent(prev.slug) + '">' +
                '<div class="k">&larr; Previous</div><div class="t">' + esc(prev.title) + '</div></a>';
        } else { h += '<span></span>'; }
        if (next) {
            h += '<a class="next" href="blog-post.html?slug=' + encodeURIComponent(next.slug) + '">' +
                '<div class="k">Next &rarr;</div><div class="t">' + esc(next.title) + '</div></a>';
        }
        h += '</div>';
        return h;
    }

    /* Phase 23: readers stay in the cluster - same category, not this post. */
    function renderRelated(post, arr) {
        var box = document.getElementById('bpRelated');
        var list = document.getElementById('bpRelatedList');
        if (!box || !list) return;
        var cat = String(post.category || 'guides').toLowerCase();
        var rel = [];
        for (var i = 0; i < arr.length; i++) {
            if (String(arr[i].id || arr[i].slug) === String(post.id || post.slug)) continue;
            if (String(arr[i].category || 'guides').toLowerCase() !== cat) continue;
            rel.push(arr[i]);
            if (rel.length >= 3) break;
        }
        if (!rel.length) return;
        list.innerHTML = rel.map(function (a) {
            var href = 'blog-post.html?slug=' + encodeURIComponent(a.slug || a.id);
            return '<a class="bp-prod" href="' + href + '">' +
                '<span class="bp-prod__n">' + esc(a.title || 'Untitled') + '</span>' +
                '<span class="bp-prod__p">' + esc((a.readMinutes || 5) + ' min') + '</span></a>';
        }).join('');
        box.style.display = '';
    }

    function render(post, neighbours) {
        setMeta(post);

        var read = post.readMinutes || BlogBlocks.readMinutes(post.blocks, post.content);
        var date = post.publishedAt || post.createdAt;
        var dateText = '';
        if (date) {
            try { dateText = new Date(date).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
            catch (e) { dateText = ''; }
        }

        var tags = (post.tags || []).map(function (t) {
            return '<span class="bp-tag">' + esc(t) + '</span>';
        }).join('');

        var body = BlogBlocks.render(post.blocks, {
            content: post.content,
            productCard: productCard
        });

        var cover = post.coverImage
            ? '<img class="bp-cover" src="' + esc(post.coverImage) + '" alt="' + esc(post.coverAlt || post.title || '') + '" decoding="async">'
            : '';

        el.innerHTML = cover +
            '<div class="bp-body">' +
                (post._offline ? '<div class="bp-offline">Showing cached articles - the blog API is unreachable right now.</div>' : '') +
                '<span class="bp-cat">' + esc(post.category || 'guides') + '</span>' +
                '<h1 class="bp-title">' + esc(post.title || 'Untitled') + '</h1>' +
                '<div class="bp-meta">' +
                    '<span><b>' + esc(post.author || 'Trendaryo Editorial') + '</b></span>' +
                    (dateText ? '<span>' + esc(dateText) + '</span>' : '') +
                    '<span>' + read + ' min read</span>' +
                    (post.views ? '<span>' + esc(post.views) + ' views</span>' : '') +
                '</div>' +
                (tags ? '<div class="bp-tags">' + tags + '</div>' : '') +
                (body || '<p>This article has no content yet.</p>') +
                relatedHtml(post.relatedProductIds) +
                '<div class="cta-band"><h2>Shop What You Just Read About</h2>' +
                '<p>Every product mentioned in these guides is in stock and ships free with tracking. US delivery in 7–15 business days.</p>' +
                '<a href="shop.html" class="btn-band">Browse the Shop</a></div>' +
                '<div id="bpRelated" style="display:none;"><h2 class="bp-h2">Related reads</h2><div id="bpRelatedList" style="display:grid;gap:.8rem;margin-top:.6rem;"></div></div>' +
                navHtml(neighbours && neighbours.prev, neighbours && neighbours.next) +
            '</div>';
    }

    function pingView(id) {
        /* One view per article per session - never let a refresh inflate it. */
        try {
            var key = 'trendaryo_viewed_' + id;
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, '1');
        } catch (e) { /* private mode - still count */ }
        if (window.API) window.API.countPostView(id).catch(function () { /* fire and forget */ });
    }

    if (!slug) { missing('No article requested.'); return; }

    if (!window.API) {
        missing('Article service unavailable.');
        return;
    }

    window.API.getPostBySlug(slug).then(function (res) {
        var post = res && res.data;
        if (!post || post.status !== 'published') { missing('Article not found.'); return; }
        render(post);
        pingView(post.id || post.slug);
        /* prev/next by publish order + related reads in the same category */
        return window.API.getPosts({ limit: 50, sort: 'newest' }).then(function (list) {
            var arr = (list && list.data) || [];
            var idx = -1, i;
            for (i = 0; i < arr.length; i++) if (String(arr[i].id || arr[i].slug) === String(post.id || post.slug)) { idx = i; break; }
            if (idx < 0) return;
            render(post, { next: arr[idx - 1] || null, prev: arr[idx + 1] || null });
            renderRelated(post, arr);
        });
    }).catch(function () {
        missing('We could not load this article. Please try again in a moment.');
    });
})();
</script>
<script>
    function hidePreloader() { var p = document.getElementById('preloader'); if (p) p.classList.add('hidden'); }
    if (document.readyState === 'complete') { setTimeout(hidePreloader, 600); }
    else { window.addEventListener('load', function () { setTimeout(hidePreloader, 600); }); }
    setTimeout(hidePreloader, 1500);
</script>
</body>
</html>
