<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Redirecting...</title>
    <link rel="stylesheet" href="responsive-universal.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        /* Retired stub - the shop deck (shop.html) fully covers advanced
           filtering: category facets, budget bands, price envelope, sort,
           compare and URL-persisted views. Any bookmarked deep link keeps
           working; a ?q= search term is mapped to the shop's own hash state
           (#q=...) so the deck opens with the search already applied. */
        (function () {
            var to = 'shop.html';
            var params = new URLSearchParams(window.location.search);
            var q = params.get('q') || params.get('query') || params.get('search');
            if (q && q.trim()) {
                to += '#q=' + encodeURIComponent(q.trim());
            }
            window.location.replace(to);
        })();
    </script>
    <style>
        @media(max-width:768px){
            .search-form{flex-direction:column;}
            .search-results{grid-template-columns:1fr;}
        }
        @media(max-width:600px){
            .search-container{padding:1rem;}
        }
    </style>
</head>
<body style="font-family:sans-serif;text-align:center;padding:3rem;color:#555;">
    <p>Advanced Search has moved into the Shop page. Taking you there...</p>
    <p><a href="shop.html">Click here if you are not redirected</a></p>
</body>
</html>
