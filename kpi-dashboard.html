<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard - Admin - Trendaryo</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="responsive-universal.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            background: linear-gradient(135deg, #00f0ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .btn.primary {
            background: rgba(0, 255, 136, 0.2);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .btn.primary:hover {
            background: rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .alerts-section {
            margin-bottom: 30px;
        }

        .alert-item {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-content {
            flex: 1;
        }

        .alert-title {
            color: #ff0055;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .alert-message {
            color: #e0e0e0;
            font-size: 0.9em;
        }

        .alert-actions {
            display: flex;
            gap: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .kpi-card:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .kpi-card.alert {
            border-color: rgba(255, 0, 85, 0.3);
            background: rgba(255, 0, 85, 0.05);
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .kpi-name {
            color: #00f0ff;
            font-weight: bold;
        }

        .kpi-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
        }

        .kpi-status.alert {
            background: #ff0055;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .kpi-value {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #00f0ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .kpi-target {
            font-size: 0.9em;
            color: #808080;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #ff00aa);
            transition: width 0.3s ease;
        }

        .kpi-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #808080;
        }

        .section {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            color: #00f0ff;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #00f0ff;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #e0e0e0;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            box-sizing: border-box;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00f0ff;
        }

        .spinner {
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top: 3px solid #00f0ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }

            .alert-item {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 KPI Dashboard</h1>
            <div class="header-actions">
                <button class="btn" onclick="goBack()">← Back</button>
                <button class="btn primary" onclick="refreshKPIs()">🔄 Refresh</button>
            </div>
        </div>

        <!-- Active Alerts -->
        <div class="alerts-section" id="alertsSection" style="display: none;">
            <div class="section-title">⚠️ Active Alerts</div>
            <div id="alertsList"></div>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid" id="kpiGrid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Set Alert Section -->
        <div class="section">
            <div class="section-title">Set KPI Alert</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label>KPI</label>
                    <select id="alertKPI">
                        <option value="revenue">Total Revenue</option>
                        <option value="orders">Total Orders</option>
                        <option value="conversion">Conversion Rate</option>
                        <option value="aov">Avg Order Value</option>
                        <option value="retention">Retention Rate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Condition</label>
                    <select id="alertCondition">
                        <option value="below">Below</option>
                        <option value="above">Above</option>
                        <option value="equals">Equals</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Threshold Value</label>
                    <input type="number" id="alertThreshold" placeholder="Enter value">
                </div>
            </div>
            <button class="btn primary" onclick="setAlert()">🔔 Set Alert</button>
        </div>
    </div>

    <script src="admin-manager.js"></script>
    <script src="analytics-engine.js"></script>
    <script>
        // Check admin access
        function checkAdminAccess() {
            if (!window.AdminManager.isAdmin()) {
                alert('Access denied. Admin privileges required.');
                window.location.href = 'admin-login.html';
            }
        }

        // Load KPIs
        async function loadKPIs() {
            try {
                const data = await window.AnalyticsEngine.getKPIDashboard();
                displayKPIs(data.kpis);
                displayAlerts(data.alerts);
            } catch (error) {
                console.error('Error loading KPIs:', error);
                document.getElementById('kpiGrid').innerHTML = 
                    '<div style="color: #ff0055;">Error loading KPI data</div>';
            }
        }

        // Display KPIs
        function displayKPIs(kpis) {
            const grid = document.getElementById('kpiGrid');
            grid.innerHTML = (kpis || []).map(kpi => {
                const percentage = (kpi.current / kpi.target) * 100;
                const isAlert = percentage < 80;
                return `
                    <div class="kpi-card ${isAlert ? 'alert' : ''}">
                        <div class="kpi-header">
                            <div class="kpi-name">${kpi.name}</div>
                            <div class="kpi-status ${isAlert ? 'alert' : ''}"></div>
                        </div>
                        <div class="kpi-value">${kpi.displayValue}</div>
                        <div class="kpi-target">Target: ${kpi.targetDisplay}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(percentage, 100)}%;"></div>
                        </div>
                        <div class="kpi-footer">
                            <span>${percentage.toFixed(1)}% of target</span>
                            <span>${kpi.change >= 0 ? '+' : ''}${kpi.change}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Display alerts
        function displayAlerts(alerts) {
            const section = document.getElementById('alertsSection');
            const list = document.getElementById('alertsList');

            if (!alerts || alerts.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = alerts.map(alert => `
                <div class="alert-item">
                    <div class="alert-content">
                        <div class="alert-title">${alert.title}</div>
                        <div class="alert-message">${alert.message}</div>
                    </div>
                    <div class="alert-actions">
                        <button class="btn btn-small" onclick="dismissAlert('${alert.id}')">Dismiss</button>
                    </div>
                </div>
            `).join('');
        }

        // Set alert
        async function setAlert() {
            const kpiId = document.getElementById('alertKPI').value;
            const condition = document.getElementById('alertCondition').value;
            const threshold = document.getElementById('alertThreshold').value;

            if (!threshold) {
                alert('Please enter a threshold value');
                return;
            }

            try {
                await window.AnalyticsEngine.setKPIAlert(kpiId, threshold, condition);
                alert('Alert set successfully!');
                document.getElementById('alertThreshold').value = '';
                loadKPIs();
            } catch (error) {
                console.error('Error setting alert:', error);
                alert('Error setting alert');
            }
        }

        // Dismiss alert
        function dismissAlert(alertId) {
            // Implementation would call backend to dismiss alert
            console.log('Dismissing alert:', alertId);
            loadKPIs();
        }

        // Refresh KPIs
        function refreshKPIs() {
            window.AnalyticsEngine.clearCache();
            loadKPIs();
        }

        // Go back
        function goBack() {
            window.location.href = 'admin-dashboard-enhanced.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAccess();
            loadKPIs();
        });
    </script>
</body>
</html>
