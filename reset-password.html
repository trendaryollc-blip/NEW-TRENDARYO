<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Trendaryo</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://trendaryo.com/reset-password.html">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-crown-star.svg">
    <link rel="stylesheet" href="responsive-universal.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles.css">
    <script src="performance.js"></script>
    <script src="bg.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0a0a; --bg-deep: #0a0a2a;
            --accent: #00f0ff; --accent-2: #ff00aa; --accent-3: #00ff88;
            --text: #ffffff; --muted: rgba(255,255,255,0.66); --muted-2: rgba(255,255,255,0.45);
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1); --glass-border-2: rgba(255,255,255,0.18);
            --card-grad: linear-gradient(168deg, rgba(255,255,255,0.075), rgba(255,255,255,0.02));
            --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --font-d: 'Orbitron', sans-serif; --font-b: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-b); background: var(--bg-deep); color: #fff; overflow-x: hidden; }
        #three-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .page-offset { padding-top: 190px; padding-bottom: 3rem; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
        .rp-shell { max-width: 440px; margin: 0 auto; padding: 0 2.5rem; }
        .rp-card { background: var(--card-grad); border: 1px solid var(--glass-border); border-radius: var(--r-lg); padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .rp-header { text-align: center; margin-bottom: 2rem; }
        .rp-title { font-family: var(--font-d); font-size: 1.5rem; font-weight: 900; margin-bottom: 0.4rem; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .rp-sub { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
        .rp-field { margin-bottom: 1.25rem; }
        .rp-label { display: block; margin-bottom: 0.4rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted-2); }
        .rp-input { width: 100%; padding: 0.85rem 1rem; border-radius: var(--r-md); border: 1px solid var(--glass-border-2); background: rgba(255,255,255,0.05); color: #fff; font-family: var(--font-b); font-size: 0.95rem; outline: none; transition: border-color 0.25s, box-shadow 0.25s; }
        .rp-input:focus { border-color: rgba(0,240,255,0.6); box-shadow: 0 0 18px rgba(0,240,255,0.12); }
        .rp-input::placeholder { color: var(--muted-2); }
        .rp-strength { margin-top: 0.4rem; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
        .rp-strength-bar { height: 100%; width: 0%; transition: width 0.3s, background 0.3s; }
        .rp-strength-weak { background: #ff4444; width: 33%; }
        .rp-strength-medium { background: #ffaa00; width: 66%; }
        .rp-strength-strong { background: var(--accent-3); width: 100%; }
        .rp-req { font-size: 0.82rem; color: var(--muted-2); margin-top: 0.3rem; }
        .rp-btn { width: 100%; padding: 0.9rem; border-radius: var(--r-md); font-family: var(--font-d); font-size: 0.68rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
        .rp-btn:hover { box-shadow: 0 0 20px rgba(0,240,255,0.4); transform: translateY(-1px); }
        .rp-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .rp-msg { padding: 0.7rem 1rem; border-radius: var(--r-md); margin-bottom: 1.25rem; text-align: center; display: none; font-size: 0.92rem; }
        .rp-msg.success { display: block; background: rgba(0,255,136,0.08); border: 1px solid var(--accent-3); color: var(--accent-3); }
        .rp-msg.error { display: block; background: rgba(255,0,170,0.08); border: 1px solid var(--accent-2); color: var(--accent-2); }
        .rp-back { text-align: center; margin-top: 1.5rem; }
        .rp-back a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .rp-back a:hover { color: var(--accent-2); }
        @media(max-width:600px){
            body{padding-top:100px;}
            .rp-shell{padding:1rem;}
            .rp-card{padding:1.5rem;border-radius:14px;}
        }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <div id="header-container"></div>
    <script src="components.js"></script>

    <main class="page-offset">
        <div class="rp-shell">
            <div class="rp-card">
                <div class="rp-header">
                    <h1 class="rp-title">Reset Password</h1>
                    <p class="rp-sub">Enter your new password below.</p>
                </div>
                <div class="rp-msg" id="successMessage">Password reset successful! Redirecting to login...</div>
                <div class="rp-msg" id="errorMessage">Invalid or expired reset token.</div>
                <form id="resetPasswordForm">
                    <div class="rp-field">
                        <label class="rp-label">New Password</label>
                        <input type="password" id="password" class="rp-input" placeholder="Enter new password" required minlength="8">
                        <div class="rp-strength"><div class="rp-strength-bar" id="strengthBar"></div></div>
                        <div class="rp-req">Password must be at least 8 characters long</div>
                    </div>
                    <div class="rp-field"><label class="rp-label">Confirm Password</label><input type="password" id="confirmPassword" class="rp-input" placeholder="Confirm new password" required></div>
                    <button type="submit" class="rp-btn" id="resetButton"><span id="buttonText">Reset Password</span></button>
                </form>
                <div class="rp-back"><p><a href="login.html">Back to Login</a></p></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="firebase-config.js"></script>
    <script src="firebase-auth-helper.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var oobCode = params.get('oobCode');
            if (!oobCode) {
                document.getElementById('errorMessage').textContent = 'Invalid or expired reset link. Please request a new one.';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('resetPasswordForm').style.display = 'none';
                return;
            }

            document.getElementById('password').addEventListener('input', function () {
                var bar = document.getElementById('strengthBar');
                var v = this.value;
                bar.className = 'rp-strength-bar';
                if (v.length >= 8 && /[A-Z]/.test(v) && /[0-9]/.test(v)) bar.classList.add('rp-strength-strong');
                else if (v.length >= 6) bar.classList.add('rp-strength-medium');
                else if (v.length > 0) bar.classList.add('rp-strength-weak');
            });

            document.getElementById('resetPasswordForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                var pw = document.getElementById('password').value;
                var confirm = document.getElementById('confirmPassword').value;
                if (pw !== confirm) { alert('Passwords do not match'); return; }
                if (pw.length < 8) { alert('Password must be at least 8 characters'); return; }

                var btn = document.getElementById('resetButton');
                btn.disabled = true; document.getElementById('buttonText').textContent = 'Resetting...';
                try {
                    await firebase.auth().confirmPasswordReset(oobCode, pw);
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('errorMessage').style.display = 'none';
                    setTimeout(function () { window.location.href = 'login.html'; }, 2000);
                } catch (e) {
                    document.getElementById('errorMessage').textContent = e.message || 'Invalid or expired reset token.';
                    document.getElementById('errorMessage').style.display = 'block';
                } finally {
                    btn.disabled = false; document.getElementById('buttonText').textContent = 'Reset Password';
                }
            });
        })();
    </script>
    <script>
        function hidePreloader() { var p = document.getElementById('preloader'); if (p) p.classList.add('hidden'); }
        if (document.readyState === 'complete') { setTimeout(hidePreloader, 600); } else { window.addEventListener('load', function () { setTimeout(hidePreloader, 600); }); }
        setTimeout(hidePreloader, 1500);
    </script>
</body>
</html>
